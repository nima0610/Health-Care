<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Doctor Registration</title>
  <style>
    /* Same CSS you used for patient, you can reuse */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #007bff; /* blue background */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-container {
      background: #fff;
      padding: 40px 30px;
      border-radius: 12px;
      width: 350px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      text-align: center;
      position: relative;
    }

    .logo-container {
      font-size: 48px;
      color: #007bff;
      margin-bottom: 20px;
    }

    form {
      width: 100%;
    }

    .form-group {
      position: relative;
      margin-bottom: 25px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px 40px 12px 15px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s ease;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #007bff;
      outline: none;
    }

    .form-group i {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #888;
      pointer-events: none;
      font-size: 18px;
    }

    button[type="submit"] {
      background-color: #007bff;
      color: white;
      padding: 12px 20px;
      width: 100%;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button[type="submit"]:hover {
      background-color: #0056b3;
    }

    .register-link {
      display: block;
      margin-top: 20px;
      color: #007bff;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }

    .page-title {
      text-align: center;
      margin-bottom: 25px;
      color: #007bff;
      font-weight: 700;
      font-size: 28px;
    }

    .register-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo-container">
      <i class="fas fa-user-md"></i>
    </div>
    <h2 class="page-title">Doctor Registration</h2>
    <form method="POST">
      <div class="form-group">
        <input type="text" name="name" placeholder="Enter your name" required />
        <i class="fas fa-user"></i>
      </div>
      <div class="form-group">
        <input type="email" name="email" placeholder="Enter your email" required />
        <i class="fas fa-envelope"></i>
      </div>
      <div class="form-group">
        <input type="password" name="password" placeholder="Enter your password" required />
        <i class="fas fa-lock"></i>
      </div>
      <div class="form-group">
        <select name="specialization" required>
          <option value="" disabled selected>Select specialization</option>
          <option value="Cardiologist">Cardiologist</option>
          <option value="Dermatologist">Dermatologist</option>
          <option value="Neurologist">Neurologist</option>
          <option value="Pediatrician">Pediatrician</option>
          <option value="Psychiatrist">Psychiatrist</option>
          <option value="General Physician">General Physician</option>
        </select>
        <i class="fas fa-stethoscope"></i>
      </div>
      <div class="form-group">
        <input type="text" name="contact" placeholder="Enter your contact number" required />
        <i class="fas fa-phone"></i>
      </div>
      <button type="submit">Register</button>
    </form>
    <a href="{{ url_for('login') }}" class="register-link">Already have an account? Login</a>
  </div>

  <!-- FontAwesome CDN for icons -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</body>
</html>
